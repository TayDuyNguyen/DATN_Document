<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Azure Explorer - Xác thực thất bại</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#004395",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-variant": "#d3e4fe",
                    "secondary-fixed-dim": "#ffb59d",
                    "on-secondary-fixed-variant": "#832600",
                    "tertiary-container": "#0064d6",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#cbdbf5",
                    "on-surface-variant": "#414753",
                    "outline-variant": "#c1c6d5",
                    "error-container": "#ffdad6",
                    "surface": "#f8f9ff",
                    "on-secondary-fixed": "#390c00",
                    "secondary": "#ab3500",
                    "primary-fixed": "#d7e3ff",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#dfe8ff",
                    "primary": "#004e9f",
                    "surface-bright": "#f8f9ff",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "outline": "#727784",
                    "surface-tint": "#005cba",
                    "surface-container-low": "#eff4ff",
                    "surface-container-highest": "#d3e4fe",
                    "secondary-container": "#fe6a34",
                    "inverse-surface": "#213145",
                    "on-secondary-container": "#5d1900",
                    "tertiary-fixed": "#d8e2ff",
                    "on-primary-fixed-variant": "#00458e",
                    "on-tertiary-fixed": "#001a42",
                    "primary-container": "#0066cc",
                    "background": "#f8f9ff",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#aac7ff",
                    "surface-container-high": "#dce9ff",
                    "secondary-fixed": "#ffdbd0",
                    "on-background": "#0b1c30",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#001b3e",
                    "on-tertiary-container": "#e1e8ff",
                    "tertiary-fixed-dim": "#adc6ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#004da7",
                    "on-surface": "#0b1c30",
                    "inverse-primary": "#aac7ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .editorial-shadow {
            box-shadow: 0 24px 48px -12px rgba(11, 28, 48, 0.08);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen flex flex-col">
<!-- Header with logo based on TopNavBar JSON -->
<header class="top-0 left-0 w-full flex justify-center items-center py-8 px-6 max-w-7xl mx-auto">
<div class="text-2xl font-black tracking-tighter text-[#004e9f] dark:text-[#d3e4fe] font-headline">
            Azure Explorer
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Subtle background texture elements for "Coastal Curated" feel -->
<div class="absolute top-1/4 -right-20 w-96 h-96 bg-surface-container-low rounded-full blur-3xl opacity-50 -z-10"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-surface-container-highest rounded-full blur-3xl opacity-30 -z-10"></div>
<!-- Failure State Card -->
<div class="bg-surface-container-lowest w-full max-w-md p-10 rounded-xl editorial-shadow text-center relative z-10">
<!-- Large Red Error Icon -->
<div class="mb-6 flex justify-center">
<div class="w-20 h-20 bg-error-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-5xl text-error" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<!-- Title: Xác thực thất bại -->
<h1 class="text-[22px] font-bold text-on-surface mb-3 tracking-tight font-headline">
                Xác thực thất bại
            </h1>
<!-- Error Message -->
<p class="text-error font-medium mb-10 leading-relaxed">
                Mã OTP không chính xác. Còn 2 lần thử.
            </p>
<!-- Action Area -->
<div class="space-y-6">
<!-- Primary Blue Button: Thử lại -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-semibold py-4 px-6 rounded-lg transition-all duration-300 scale-95 active:scale-90 flex items-center justify-center gap-2">
                    Thử lại
                </button>
<!-- Greyed out link: Gửi lại -->
<div class="text-sm">
<p class="text-on-surface-variant opacity-60">
                        Không nhận được email? <span class="text-outline font-medium cursor-not-allowed">Gửi lại sau 45s</span>
</p>
</div>
</div>
</div>
</main>
<!-- Footer based on Footer JSON -->
<footer class="w-full py-12 bg-[#f8f9ff] dark:bg-[#0b1c30]">
<div class="flex flex-col items-center gap-4 w-full text-center px-6">
<div class="flex flex-wrap justify-center gap-6 mb-2">
<a class="font-['Inter'] text-sm leading-relaxed opacity-60 text-[#004e9f] dark:text-[#d3e4fe] hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Privacy Policy</a>
<a class="font-['Inter'] text-sm leading-relaxed opacity-60 text-[#004e9f] dark:text-[#d3e4fe] hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Terms of Service</a>
<a class="font-['Inter'] text-sm leading-relaxed opacity-60 text-[#004e9f] dark:text-[#d3e4fe] hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Help Center</a>
</div>
<p class="font-['Inter'] text-sm leading-relaxed opacity-60 text-[#004e9f] dark:text-[#d3e4fe]">
                © 2024 Azure Explorer. All rights reserved.
            </p>
</div>
</footer>
</body></html>
