<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        @keyframes custom-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-slow-spin {
            animation: custom-spin 1.5s linear infinite;
        }
    </style>
</head>
<body class="bg-background font-body text-on-background antialiased flex flex-col min-h-screen">
<!-- TopNavBar (Shared Component Shell) -->
<!-- Suppression logic: Transactional flow, but minimal header requested -->
<header class="top-0 left-0 w-full flex justify-center items-center py-8 px-6 max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">travel_explore</span>
</div>
<span class="text-2xl font-black tracking-tighter text-[#004e9f] dark:text-[#d3e4fe]">Azure Explorer</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-md">
<!-- Central Editorial Card -->
<div class="bg-surface-container-lowest rounded-xl p-10 text-center flex flex-col items-center gap-8 shadow-[0_32px_64px_-12px_rgba(11,28,48,0.08)]">
<!-- Loading Spinner Container -->
<div class="relative w-20 h-20 flex items-center justify-center">
<!-- Outer rotating ring -->
<div class="absolute inset-0 border-4 border-surface-container rounded-full"></div>
<div class="absolute inset-0 border-4 border-primary-container border-t-transparent rounded-full animate-slow-spin"></div>
<!-- Center Icon -->
<span class="material-symbols-outlined text-primary-container text-[48px]">mark_email_read</span>
</div>
<div class="space-y-3">
<h1 class="text-[20px] font-bold tracking-tight text-on-surface">
                        Đang xác thực email...
                    </h1>
<p class="text-[14px] leading-relaxed text-on-surface-variant opacity-70 px-4">
                        Hệ thống đang kiểm tra thông tin của bạn. Vui lòng chờ trong giây lát để hoàn tất quá trình đăng ký.
                    </p>
</div>
<!-- Subtle Decorative Element (Editorial touch) -->
<div class="w-12 h-1 bg-surface-container-high rounded-full"></div>
<!-- Security Assurance -->
<div class="flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-primary text-sm">verified_user</span>
<span class="text-[11px] font-medium uppercase tracking-wider text-primary">Bảo mật đa tầng</span>
</div>
</div>
<!-- Contextual Branding Image (Editorial Layout) -->
<div class="mt-12 opacity-40 grayscale flex justify-center">
<img alt="Skyline" class="max-w-[200px]" data-alt="minimalist line art illustration of Da Nang city skyline featuring the Dragon Bridge and high-rise buildings in soft cerulean blue" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8MLB_wIXczVXsM90hm8sXPKFL6KtmCaziMitSpMWx4CgS_VszZMZMqhu1UdL9nY_-jX9S0D0RGEGImMMVHGCjbkli9r_dg-b6x8GIM7oFIF3DMfisj6pdiaatJDxOAn5m-cF9fUJDYFJLcCXc5E9Fk0k7bWYf03dcXYlEjaL8EwNQAOhwZmev5t37jqGi8O5itbC97oDIzBTG6KCFmcrvMpCGDUNBUMc1pX0SSsyWIP7XQzBL3Y8ApOWXDscQ8Wm4gKLZcu2C9A"/>
</div>
</div>
</main>

<footer class="w-full py-12 bg-[#f8f9ff] dark:bg-[#0b1c30]">
<div class="flex flex-col items-center gap-4 w-full text-center px-6">
<div class="flex gap-6 text-[#0b1c30] dark:text-white opacity-50 font-['Inter'] text-sm leading-relaxed">
<a class="hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Privacy Policy</a>
<a class="hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Terms of Service</a>

</div>
<p class="font-['Inter'] text-sm leading-relaxed opacity-60 text-[#004e9f] dark:text-[#d3e4fe]">

            </p>
</div>
</footer>
