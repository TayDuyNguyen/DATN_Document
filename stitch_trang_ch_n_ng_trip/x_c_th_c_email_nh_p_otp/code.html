<!DOCTYPE html>

<html class="light" lang="vi"><head>

                    "on-secondary-fixed": "#390c00",
                    "secondary": "#ab3500",

                    "on-secondary": "#ffffff",
                    "on-primary-container": "#dfe8ff",
                    "primary": "#004e9f",
                    "surface-bright": "#f8f9ff",
                    "error": "#ba1a1a",

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col">
<!-- TopNavBar Suppression: Hidden as this is a focused transactional journey -->
<header class="w-full flex justify-center items-center py-12">
<div class="flex items-center gap-2">
<span class="text-3xl font-black tracking-tighter text-primary">Azure Explorer</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pb-20">
<!-- Central Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-10 shadow-sm border border-outline-variant/10">
<div class="flex flex-col items-center text-center">
<!-- Icon State -->
<div class="w-20 h-20 rounded-full bg-surface-container-low flex items-center justify-center mb-8">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                        mark_email_unread
                    </span>
</div>
<!-- Title & Context -->
<h1 class="text-[22px] font-bold text-on-surface tracking-tight mb-3">
                    Xác thực email của bạn
                </h1>
<p class="text-on-surface-variant text-sm leading-relaxed mb-10">
                    Chúng tôi đã gửi mã xác thực đến <br/>
<span class="text-primary-container font-semibold">nguyenvanan@gmail.com</span>
</p>
<!-- OTP Input Grid -->
<div class="grid grid-cols-6 gap-3 mb-10 w-full">
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" type="text" value="4"/>
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" type="text" value="8"/>
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" type="text" value="2"/>
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" placeholder="-" type="text"/>
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" placeholder="-" type="text"/>
<input class="otp-input w-full aspect-square text-center text-2xl font-extrabold text-primary border-2 border-outline-variant rounded-lg bg-surface-bright" maxlength="1" placeholder="-" type="text"/>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-bold text-base hover:bg-primary-container transition-all duration-300 transform active:scale-[0.98]">
                    Xác thực
                </button>
<!-- Footer Action -->
<div class="mt-8">
<p class="text-on-surface-variant text-sm">
                        Không nhận được email? 
                        <a class="text-primary font-semibold hover:underline ml-1" href="#">Gửi lại email</a>
</p>
</div>
</div>
</div>
</main>
<!-- Shared Component: Footer (Applied from JSON) -->
<footer class="bg-[#f8f9ff] dark:bg-[#0b1c30] w-full py-12 flex flex-col items-center gap-4 text-center px-6">
<div class="flex gap-8 mb-2">
<a class="text-[#0b1c30] dark:text-white opacity-50 text-sm font-['Inter'] leading-relaxed hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Privacy Policy</a>
<a class="text-[#0b1c30] dark:text-white opacity-50 text-sm font-['Inter'] leading-relaxed hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Terms of Service</a>
<a class="text-[#0b1c30] dark:text-white opacity-50 text-sm font-['Inter'] leading-relaxed hover:text-[#0066cc] hover:opacity-100 transition-all cursor-pointer" href="#">Help Center</a>
</div>
<p class="text-[#004e9f] dark:text-[#d3e4fe] font-['Inter'] text-sm leading-relaxed opacity-60">
            © 2024 Azure Explorer. All rights reserved.
        </p>
</footer>
